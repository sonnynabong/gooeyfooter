<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Sticky Bubble Effect - Interactive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #fff;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 280px;
        }

        .controls h2 {
            font-family: system-ui, sans-serif;
            font-size: 18px;
            color: #333;
            margin: 0;
        }

        .color-picker {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-picker label {
            font-family: system-ui, sans-serif;
            font-size: 14px;
            color: #555;
        }

        .color-picker input[type="color"] {
            width: 50px;
            height: 35px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .preset-colors {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .preset-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .preset-btn:hover {
            transform: scale(1.2);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .info {
            font-family: system-ui, sans-serif;
            font-size: 12px;
            color: #888;
            text-align: center;
        }

        .info a {
            color: #666;
        }

        .g-wrap {
            position: relative;
            min-height: 100vh;
            background: #fff;
            filter: contrast(8);
        }

        .g-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 86px;
            width: 100%;
            background: var(--bubble-color, #26b4f5);
            transition: background 0.3s ease;
        }

        .g-footer::before {
            content: "";
            position: absolute;
            top: -300px;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            backdrop-filter: blur(5px);
        }

        .g-bubble {
            position: absolute;
            background: var(--bubble-color, #26b4f5);
            border-radius: 50%;
            transition: background 0.3s ease;
        }

        /* 500 bubbles with random properties - generated via JavaScript */
        
        @keyframes moveToTop {
            90% {
                opacity: 1;
            }
            100% {
                opacity: .08;
                transform: translate(-50%, -180px) scale(.3);
            }
        }

        .view-flames {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background: #ff5722;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-family: system-ui, sans-serif;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.4);
            transition: all 0.3s ease;
            z-index: 1001;
        }

        .view-flames:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 87, 34, 0.5);
        }
    </style>
</head>
<body>
    <div class="controls">
        <h2>Bubble Color</h2>
        <div class="color-picker">
            <label>Custom:</label>
            <input type="color" id="colorPicker" value="#26b4f5">
        </div>
        <div class="preset-colors">
            <button class="preset-btn" style="background: #26b4f5" data-color="#26b4f5"></button>
            <button class="preset-btn" style="background: #ff006e" data-color="#ff006e"></button>
            <button class="preset-btn" style="background: #8338ec" data-color="#8338ec"></button>
            <button class="preset-btn" style="background: #3a86ff" data-color="#3a86ff"></button>
            <button class="preset-btn" style="background: #06d6a0" data-color="#06d6a0"></button>
            <button class="preset-btn" style="background: #ffbe0b" data-color="#ffbe0b"></button>
            <button class="preset-btn" style="background: #fb5607" data-color="#fb5607"></button>
            <button class="preset-btn" style="background: #e63946" data-color="#e63946"></button>
        </div>
        <div class="info">
            500 bubbles rising! | <a href="https://medium.com/@rocchokcoco/css-awesome-sticky-bubble-effect-d2cc23241153" target="_blank">Original Article</a>
        </div>
    </div>

    <a href="flames.html" class="view-flames">View Flame Version 🔥</a>

    <div class="g-wrap">
        <div class="g-footer" id="footer">
            <!-- Bubbles will be generated via JavaScript -->
        </div>
    </div>

    <script>
        // Generate 500 bubbles dynamically
        const footer = document.getElementById('footer');
        
        for (let i = 1; i <= 500; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'g-bubble';
            
            // Random properties
            const left = Math.random() * 100;
            const top = Math.random() * 100;
            const width = 20 + Math.random() * 80;
            const height = width;
            const duration = (1500 + Math.random() * 2500) / 1000;
            const delay = -(Math.random() * 5000) / 1000;
            
            bubble.style.cssText = `
                left: ${left}%;
                top: ${top}px;
                width: ${width}px;
                height: ${height}px;
                animation: moveToTop ${duration}s ease-in-out ${delay}s infinite;
            `;
            
            footer.appendChild(bubble);
        }

        // Color picker functionality
        const colorPicker = document.getElementById('colorPicker');
        const presetBtns = document.querySelectorAll('.preset-btn');
        const root = document.documentElement;

        colorPicker.addEventListener('input', (e) => {
            root.style.setProperty('--bubble-color', e.target.value);
        });

        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const color = btn.getAttribute('data-color');
                root.style.setProperty('--bubble-color', color);
                colorPicker.value = color;
            });
        });
    </script>
</body>
</html>
