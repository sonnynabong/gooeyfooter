        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #fff;
        }

        .g-wrap {
            position: relative;
            min-height: 100vh;
            background: #fff;
            filter: contrast(8);
        }

        .g-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 86px;
            width: 100%;
            background: #26b4f5;
        }

        .g-footer::before {
            content: "";
            position: absolute;
            top: -300px;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            backdrop-filter: blur(5px);
        }

        .g-bubble {
            position: absolute;
            background: #26b4f5;
            border-radius: 50%;
        }
